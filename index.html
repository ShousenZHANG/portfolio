<!doctype html>

    <meta name="author" content="Eddy Zhang" />
    <!-- Must equal the sRGB paint of --ink-0, or mobile browser chrome draws a
         lighter band above a darker page and the seam is visible at the viewport top. -->
    <meta name="theme-color" content="#07080e" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://eddyzhang.me/" />
    <!-- hreflang must be reciprocal and self-referencing on BOTH pages, or
         Google ignores the whole set. zh-Hans (script subtag) targets
         Simplified readers wherever they are; x-default catches the rest. -->
    <link rel="alternate" hreflang="en" href="https://eddyzhang.me/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://eddyzhang.me/zh" />
    <link rel="alternate" hreflang="x-default" href="https://eddyzhang.me/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Raster only: iOS ignores an SVG here and screenshots the page instead.
         Generated from apple-touch-icon.svg by scripts/gen-icons.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Without this Android's "add to home screen" has no name, icon or theme to use
         and falls back to the document title plus a screenshot. Same-origin, so the CSP's
         default-src 'self' already covers the fetch (manifest-src falls back to it). -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts are self-hosted (see src/index.css) — no third-party font CDN.
         The display face is preloaded by the preloadDisplayFont plugin in vite.config.js;
         its filename is content-hashed, so the tag is injected at build time.
         No preconnect: every asset this page fetches is same-origin. -->

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eddyzhang.me/" />
    <meta property="og:site_name" content="Eddy Zhang" />
    <meta property="og:title" content="Eddy Zhang — AI Engineer | Copilot Studio & Power Platform" />
    <meta property="og:description" content="AI Engineer building production Copilot Studio & Power Platform agents across the Microsoft 365 ecosystem. Featuring a live AI-powered JD matcher." />
    <meta property="og:image" content="https://eddyzhang.me/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Eddy Zhang — AI Engineer, Copilot Studio & Power Platform" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eddy Zhang — AI Engineer | Copilot Studio & Power Platform" />
    <meta name="twitter:description" content="AI Engineer building production AI agents across the Microsoft 365 ecosystem." />
    <meta name="twitter:image" content="https://eddyzhang.me/api/og" />
    <!-- Mirrors og:image:alt. X renders the card from the twitter:* namespace when it is
         present, so an alt supplied only on the OG side never reaches a screen reader there. -->
    <meta name="twitter:image:alt" content="Eddy Zhang — AI Engineer, Copilot Studio & Power Platform" />

    <!-- CSP-COUPLED: vercel.json pins a sha256 of this block in script-src, and Chrome does
         evaluate application/ld+json against script-src. Because a hash is present, browsers
         ignore 'unsafe-inline' entirely, so ANY edit below — including whitespace or indent —
         silently drops the structured data. After changing it, rebuild and repin:
         npm run build
         node -e "const c=require('crypto'),f=require('fs');const m=f.readFileSync('dist/index.html','utf8').match(/ld\+json\">([\s\S]*?)<\/script>/);console.log('sha256-'+c.createHash('sha256').update(m[1]).digest('base64'))"
         Keep this file LF-only; a CRLF checkout changes the bytes and therefore the hash.
         (vercel.json is strict JSON and cannot carry this note itself.) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",

          { "@type": "EducationalOccupationalCredential", "name": "Claude Certified Architect - Foundations", "url": "https://www.credly.com/badges/65cd527d-e468-4455-a587-359bec7eb248" }
        ],
