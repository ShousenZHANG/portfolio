<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Eddy Zhang logo">
  <defs>
    <linearGradient id="eddyGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <!-- Literal sRGB of the sig / sig-2 tokens (oklch, gamut-clipped). SVG files
           cannot read CSS custom properties, so keep these in sync by hand.
           NB: no double hyphens in SVG comments, that is an XML parse error. -->
      <stop offset="0" stop-color="#7d7fff"/>
      <stop offset="1" stop-color="#35c5db"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#eddyGrad)"/>
  <!-- geometric E monogram -->
  <g fill="#08091b">
    <rect x="18" y="17" width="6.5" height="30" rx="3.25"/>
    <rect x="18" y="17" width="27" height="6.5" rx="3.25"/>
    <rect x="18" y="28.75" width="18" height="6.5" rx="3.25"/>
    <rect x="18" y="40.5" width="27" height="6.5" rx="3.25"/>
  </g>
  <!-- neural signal node -->
  <circle cx="42.5" cy="32" r="3.6" fill="#08091b"/>
</svg>
